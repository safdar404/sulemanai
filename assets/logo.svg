<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Suleman AI agent logo">
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset=".2" stop-color="#ff9f1c"/>
      <stop offset=".4" stop-color="#ffe14d"/>
      <stop offset=".6" stop-color="#2ee59d"/>
      <stop offset=".8" stop-color="#2bb8ff"/>
      <stop offset="1" stop-color="#a64dff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1a3f"/>
      <stop offset="1" stop-color="#0b0a1f"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb8ff"/>
      <stop offset="1" stop-color="#2ee59d"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="34" fill="url(#rb)"/>
  <rect x="7" y="7" width="114" height="114" rx="30" fill="#0e0c26"/>
  <!-- antenna -->
  <line x1="64" y1="30" x2="64" y2="20" stroke="url(#rb)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="17" r="6" fill="#ffe14d"/>
  <circle cx="64" cy="17" r="2.6" fill="#fff"/>
  <!-- ears -->
  <rect x="17" y="56" width="10" height="24" rx="5" fill="#ff3d6e"/>
  <rect x="101" y="56" width="10" height="24" rx="5" fill="#a64dff"/>
  <!-- head -->
  <rect x="25" y="31" width="78" height="72" rx="24" fill="url(#face)" stroke="url(#rb)" stroke-width="4"/>
  <!-- visor -->
  <rect x="34" y="47" width="60" height="28" rx="14" fill="#05040f"/>
  <ellipse cx="51" cy="61" rx="7.5" ry="8.5" fill="url(#eye)"/>
  <ellipse cx="77" cy="61" rx="7.5" ry="8.5" fill="url(#eye)"/>
  <circle cx="53.5" cy="57.5" r="2.6" fill="#fff"/>
  <circle cx="79.5" cy="57.5" r="2.6" fill="#fff"/>
  <!-- smile -->
  <path d="M50 86 Q64 95 78 86" fill="none" stroke="#ff9f1c" stroke-width="4" stroke-linecap="round"/>
  <!-- spark -->
  <path d="M100 18 l2.6 7.4 7.4 2.6 -7.4 2.6 -2.6 7.4 -2.6 -7.4 -7.4 -2.6 7.4 -2.6z" fill="#fff"/>
</svg>
